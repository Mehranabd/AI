<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My first website</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; color: #172554; font-family: system-ui, sans-serif; }
    main { margin: 24px; padding: 40px; max-width: 520px; border-radius: 24px; background: white; box-shadow: 0 16px 48px #17255418; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 16px; }
    p { line-height: 1.7; }
    button { padding: 12px 22px; border: 0; border-radius: 10px; background: #4338ca; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #172554; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>It works!</h1>
    <p>Welcome to your first HTML website. You can open this file directly in your browser.</p>
    <button id="hello" type="button">Say hello</button>
    <p id="message" role="status">Click the button to test the page.</p>
  </main>
  <script>
    document.getElementById('hello').addEventListener('click', () => {
      document.getElementById('message').textContent = 'Hello! Your website is working.';
    });
  </script>
</body>
</html>
